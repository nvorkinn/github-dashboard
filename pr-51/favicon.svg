<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>GitHub dashboard</title>
  <!-- Three lanes of work in the page's dark panel and state colours: done, running, waiting. The edge keeps the
       tile visible on a dark tab bar. -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="#121826" stroke="#3a4766" vector-effect="non-scaling-stroke"/>
  <rect x="4" y="6" width="6" height="20" rx="2" fill="#56d364"/>
  <rect x="13" y="6" width="6" height="14" rx="2" fill="#6cb6ff"/>
  <rect x="22" y="6" width="6" height="8" rx="2" fill="#e3b341"/>
</svg>
