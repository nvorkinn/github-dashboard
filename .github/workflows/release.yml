name: Release

# Shown on the GitHub dashboard among the running releases.
# dashboard: release

# Publishes the image, for amd64. A push to main publishes ghcr.io/nvorkinn/github-dashboard:main, which
# home-stack runs, and then starts home-stack's Deploy workflow, which pulls it. A v* tag publishes :<tag> and :latest
# and the GitHub Release for the tag with the image's digest in it, and deploys nothing.
on:
  push:
    branches: [main]
    tags: ["v*"]
    # Not evaluated for tags, so every tag still releases.
    paths-ignore: ["**.md"]
  # The "Run workflow" button (Actions > Release): tags the head of main with the next version after the
  # latest v* tag, then releases it in this same run. A tag pushed with the workflow's own token starts no
  # second run.
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

# One run per ref at a time, so an older push to main can't move :main after a newer one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # To create the tag on a button release.
      contents: write
    outputs:
      value: ${{ steps.tag.outputs.value }}
    steps:
      - name: Work out and create the next tag
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "Release from main, not $GITHUB_REF" >&2; exit 1; }
          # Through the API, so it also works should the repository be private. No tag yet is an empty list.
          tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
            --jq '.[].ref | ltrimstr("refs/tags/")')"
          latest="$({ grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' <<< "$tags" || true; } | sort -V | tail -1)"
          IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
          major="${major#v}"
          case "$BUMP" in
            major) next="v$((major + 1)).0.0" ;;
            minor) next="v$major.$((minor + 1)).0" ;;
            *) next="v$major.$minor.$((patch + 1))" ;;
          esac
          # Fails if the tag already exists, e.g. two releases started at once.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$next" -f sha="$GITHUB_SHA" > /dev/null
          echo "Tagged $GITHUB_SHA as $next (after ${latest:-no tag})"
          echo "NEXT_TAG=$next" >> "$GITHUB_ENV"

      - name: Extract tag
        id: tag
        run: |
          # The tag just made by the button, else the pushed tag, else main for a push to main.
          if [ -n "${NEXT_TAG:-}" ]; then
            tag="$NEXT_TAG"
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            tag=main
          else
            tag="${GITHUB_REF#refs/tags/}"
            # It becomes the image's tag, so keep it to what a registry accepts.
            [[ "$tag" =~ ^v[0-9A-Za-z._-]+$ ]] || { echo "Unsupported tag: $tag" >&2; exit 1; }
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

  # Built for amd64, which is what the home server is. The image is started and asked for the page and its health before
  # anything is pushed, then pushed under its tags: main, or the release's and latest.
  image:
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.value }}
    env:
      TAG: ${{ needs.tag.outputs.value }}
      # The same labels on the build that is tested and the one that is pushed, so the second is the first, from cache.
      LABELS: |
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.version=${{ needs.tag.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Into the runner's Docker, to start it. Attestations can't be loaded there; the pushed build below has them.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          labels: ${{ env.LABELS }}
          tags: github-dashboard
          load: true
          provenance: false
          sbom: false

      # The same check as the Tests workflow's image job.
      - name: Start and check
        run: |
          docker run -d --name github-dashboard -p 8080:8080 github-dashboard
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="app">'
      - name: Logs
        if: always()
        run: docker logs github-dashboard

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every layer comes from the build above, still in the builder's cache. BuildKit's own attestations are pushed
      # beside the image as extra (unknown/unknown platform) manifests, under an index that the tags name.
      # main's build is only :main; a release also moves :latest.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          labels: ${{ env.LABELS }}
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.TAG != 'main' && format('{0}:latest', env.IMAGE) || '' }}
          push: true
          provenance: mode=max
          sbom: true

      - name: Report the digest
        id: digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # The digest of the index (the image and its attestations), which is what a pin by digest names.
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "No digest for $IMAGE:$TAG: $DIGEST" >&2; exit 1; }
          echo "value=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "Pushed:"
            echo
            echo '```'
            echo "$IMAGE:$TAG@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The GitHub Release for the tag: the image to pin, then the notes GitHub generates from the pull requests merged
  # since the last one. It has no assets. Not for main's build.
  github-release:
    needs: [tag, image]
    if: needs.tag.outputs.value != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ needs.tag.outputs.value }}
      DIGEST: ${{ needs.image.outputs.digest }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create the GitHub Release
        run: |
          image="Image: \`$IMAGE:$TAG@$DIGEST\`"
          # A release made by hand (which is what pushed the tag) or by an earlier attempt of this run is kept, and
          # gets the image added unless it already names this one.
          if body="$(gh release view "$TAG" --json body --jq .body 2> /dev/null)"; then
            [[ "$body" == *"$DIGEST"* ]] || gh release edit "$TAG" --notes "$image"$'\n\n'"$body"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --notes "$image"
          fi

  # Main's build reaches the server: home-stack's Deploy workflow pulls :main and recreates the container. It runs there
  # because the stack's secrets and the server's Docker are there. HOME_STACK_DEPLOY_TOKEN is a fine-grained token for
  # nvorkinn/home-stack only, with Actions: read and write, which is all starting a workflow needs.
  deploy:
    needs: [tag, image]
    if: needs.tag.outputs.value == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start home-stack's Deploy
        env:
          GH_TOKEN: ${{ secrets.HOME_STACK_DEPLOY_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::The HOME_STACK_DEPLOY_TOKEN secret isn't set"; exit 1; }
          gh workflow run deploy.yml --repo nvorkinn/home-stack --ref main
          echo "Started https://github.com/nvorkinn/home-stack/actions/workflows/deploy.yml" >> "$GITHUB_STEP_SUMMARY"
