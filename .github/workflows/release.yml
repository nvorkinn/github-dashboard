name: Release

# Shown on the GitHub dashboard among the running releases.
# dashboard: release

# Publishes the image home-stack runs: ghcr.io/nvorkinn/github-dashboard:<tag>, for amd64 and arm64, and the GitHub
# Release for the tag with the image's digest in it. Nothing is deployed from here: home-stack pins the image by tag
# and digest, and moving that pin is the deploy: the last job opens the pull request in home-stack that does it.
on:
  push:
    tags: ["v*"]
  # The "Run workflow" button (Actions > Release): tags the head of main with the next version after the
  # latest v* tag, then releases it in this same run. A tag pushed with the workflow's own token starts no
  # second run.
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # To create the tag on a button release.
      contents: write
    outputs:
      value: ${{ steps.tag.outputs.value }}
    steps:
      - name: Work out and create the next tag
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "Release from main, not $GITHUB_REF" >&2; exit 1; }
          # Through the API, so it also works should the repository be private. No tag yet is an empty list.
          tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
            --jq '.[].ref | ltrimstr("refs/tags/")')"
          latest="$({ grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' <<< "$tags" || true; } | sort -V | tail -1)"
          IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
          major="${major#v}"
          case "$BUMP" in
            major) next="v$((major + 1)).0.0" ;;
            minor) next="v$major.$((minor + 1)).0" ;;
            *) next="v$major.$minor.$((patch + 1))" ;;
          esac
          # Fails if the tag already exists, e.g. two releases started at once.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$next" -f sha="$GITHUB_SHA" > /dev/null
          echo "Tagged $GITHUB_SHA as $next (after ${latest:-no tag})"
          echo "NEXT_TAG=$next" >> "$GITHUB_ENV"

      - name: Extract tag
        id: tag
        run: |
          # The tag just made by the button, else the pushed tag.
          tag="${NEXT_TAG:-${GITHUB_REF#refs/tags/}}"
          # It becomes the image's tag, so keep it to what a registry accepts.
          [[ "$tag" =~ ^v[0-9A-Za-z._-]+$ ]] || { echo "Unsupported tag: $tag" >&2; exit 1; }
          echo "value=$tag" >> "$GITHUB_OUTPUT"

  # One build per architecture, side by side, each on a runner of its own architecture (no emulation): amd64 for the x86
  # home server, arm64 so the image also runs on an ARM host. Each is started and asked for the page and its health
  # before anything is pushed, then pushed by digest, with BuildKit's provenance and SBOM beside it. The `image` job
  # below joins the two into the tags.
  build:
    name: build (${{ matrix.arch }})
    needs: tag
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    env:
      # The same labels on the build that is tested and the one that is pushed, so the second is the first, from cache.
      LABELS: |
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.version=${{ needs.tag.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Into the runner's Docker, to start it. Attestations can't be loaded there; the pushed build below has them.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ env.LABELS }}
          tags: github-dashboard
          load: true
          provenance: false
          sbom: false

      # The same check as the Tests workflow's image job.
      - name: Start and check
        run: |
          docker run -d --name github-dashboard -p 8080:8080 github-dashboard
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="app">'
      - name: Logs
        if: always()
        run: docker logs github-dashboard

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every layer comes from the build above, still in the builder's cache. BuildKit's own attestations are pushed
      # beside the image as extra (unknown/unknown platform) manifests in the index of this digest; the join below keeps
      # them, so a pull still picks its own platform's image.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ env.LABELS }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Keep the digest for the join
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # The architectures joined into one multi-platform tag: the release's, and latest.
  image:
    needs: [tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.join.outputs.digest }}
    env:
      TAG: ${{ needs.tag.outputs.value }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Tag the join of the architectures
        id: join
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046  # one argument per digest file
          docker buildx imagetools create --tag "$IMAGE:$TAG" --tag "$IMAGE:latest" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$TAG"
          # The digest of the multi-platform index, which is what a pin by digest names.
          digest="$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "No digest for $IMAGE:$TAG: $digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "Pushed, for home-stack's compose.yaml:"
            echo
            echo '```'
            echo "$IMAGE:$TAG@$digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The GitHub Release for the tag: the image to pin, then the notes GitHub generates from the pull requests merged
  # since the last one. It has no assets.
  github-release:
    needs: [tag, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ needs.tag.outputs.value }}
      DIGEST: ${{ needs.image.outputs.digest }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create the GitHub Release
        run: |
          image="Image: \`$IMAGE:$TAG@$DIGEST\`"
          # A release made by hand (which is what pushed the tag) or by an earlier attempt of this run is kept, and
          # gets the image added unless it already names this one.
          if body="$(gh release view "$TAG" --json body --jq .body 2> /dev/null)"; then
            [[ "$body" == *"$DIGEST"* ]] || gh release edit "$TAG" --notes "$image"$'\n\n'"$body"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --notes "$image"
          fi

  # Moves home-stack's pin to the new image: a pull request in nvorkinn/home-stack that changes the github-dashboard
  # line in compose.yaml and merges itself once home-stack's checks pass, which deploys it. The workflow's own token
  # can't write to another repository, and a pull request opened with it would start no checks there, so this uses a
  # token from the home-stack-bump GitHub App (installed on home-stack only, with contents and pull requests write).
  home-stack:
    needs: [tag, image, github-release]
    # Until the app is set up, a release still publishes and home-stack is bumped by hand.
    if: vars.HOME_STACK_BUMP_APP_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ needs.tag.outputs.value }}
      DIGEST: ${{ needs.image.outputs.digest }}
      GH_REPO: nvorkinn/home-stack
    steps:
      - name: Get a token for home-stack
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.HOME_STACK_BUMP_APP_ID }}
          private-key: ${{ secrets.HOME_STACK_BUMP_PRIVATE_KEY }}
          owner: nvorkinn
          repositories: home-stack
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nvorkinn/home-stack
          token: ${{ steps.token.outputs.token }}
          path: home-stack
          persist-credentials: false

      - name: Open the pull request and let it merge itself
        working-directory: home-stack
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          pin="$IMAGE:$TAG@$DIGEST"
          sed -i -E "s#^(\s*image: )$IMAGE:[^ ]+\$#\1$pin#" compose.yaml
          grep -qF "image: $pin" compose.yaml || { echo "No github-dashboard image line in compose.yaml" >&2; exit 1; }
          if git diff --quiet; then
            echo "home-stack already runs $pin"
            exit 0
          fi
          branch="github-dashboard-$TAG"
          user_id="$(gh api "users/$APP_SLUG%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "$user_id+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -qam "Bump github-dashboard to $TAG"
          # The checkout keeps no credentials, so the token goes to git for this one push.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push --force origin "$branch"
          notes="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          url="$(gh pr view "$branch" --json url --jq .url 2> /dev/null)" ||
            url="$(gh pr create --head "$branch" --title "Bump github-dashboard to $TAG" \
              --body "Moves the \`github-dashboard\` service to [$TAG]($notes): \`$pin\`. Opened by the release; it merges itself once the checks pass.")"
          gh pr merge "$url" --auto --merge
          # An earlier release's pull request that hasn't merged yet is superseded by this one.
          gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"github-dashboard-v\")) | select(.headRefName != \"$branch\") | .number" |
            while read -r number; do
              gh pr close "$number" --delete-branch --comment "Superseded by $url."
            done
          echo "home-stack: $url" >> "$GITHUB_STEP_SUMMARY"
