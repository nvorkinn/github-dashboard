name: Preview

# Publishes the demo (the page on sample data, see web/src/demo.ts) to GitHub Pages so a change can be looked at and
# clicked through: each pull request's at <pages>/pr-<number>/, main's at the root. The files live on the gh-pages
# branch, which Pages serves as it is. A pull request's folder goes when it closes.
#
# The build runs the pull request's code with a read-only token; only the deploy job, which runs none of it, can write.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build:demo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo
          path: dist/demo
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    # A fork's or Dependabot's pull request gets a read-only token, so it has no preview.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    # Shows on the pull request as a deployment with a "View deployment" button.
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'demo' }}
      url: ${{ steps.publish.outputs.url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demo
          path: ${{ runner.temp }}/demo
      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          remote="${REMOTE:-https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git}"
          if [ -n "$PR" ]; then folder="pr-$PR"; else folder=""; fi
          # Other pull requests publish to the same branch, so start again from its newest commit when a push loses.
          for attempt in 1 2 3 4 5; do
            site="$RUNNER_TEMP/site-$attempt"
            git init -q "$site"
            cd "$site"
            git remote add origin "$remote"
            # The first run starts the branch.
            if git fetch -q --depth 1 origin gh-pages; then
              git checkout -q -B gh-pages FETCH_HEAD
            else
              git checkout -q --orphan gh-pages
            fi
            # Serve the files as they are, with no Jekyll build.
            touch .nojekyll
            if [ -n "$folder" ]; then
              rm -rf "$folder"
              mkdir "$folder"
              cp -R "$RUNNER_TEMP/demo/." "$folder/"
              message="Preview of #$PR at $SHA"
            else
              # Main's demo is the root: replace everything but the pull requests' folders.
              find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .nojekyll ! -name 'pr-*' -exec rm -rf {} +
              cp -R "$RUNNER_TEMP/demo/." .
              message="Demo of main at $SHA"
            fi
            git add -A
            if git diff --cached --quiet; then
              break
            fi
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "$message"
            if git push -q origin gh-pages; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::Could not push to gh-pages after 5 attempts"
              exit 1
            fi
            sleep $((attempt * 2))
          done
          echo "url=https://${OWNER}.github.io/${NAME}/${folder:+$folder/}" >> "$GITHUB_OUTPUT"

  remove:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Remove the pull request's preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          remote="${REMOTE:-https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git}"
          for attempt in 1 2 3 4 5; do
            site="$RUNNER_TEMP/site-$attempt"
            git init -q "$site"
            cd "$site"
            git remote add origin "$remote"
            git fetch -q --depth 1 origin gh-pages || exit 0
            git checkout -q -B gh-pages FETCH_HEAD
            [ -d "pr-$PR" ] || exit 0
            git rm -rq "pr-$PR"
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Remove the preview of #$PR"
            if git push -q origin gh-pages; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "::error::Could not push to gh-pages after 5 attempts"
          exit 1
