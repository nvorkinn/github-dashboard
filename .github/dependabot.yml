version: 2
updates:
  # package.json and package-lock.json.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
  # The Dockerfile's Node base image. Its major moves with .node-version, by hand, so the image and CI run the same Node.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
