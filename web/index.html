<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The header's colour, so the phone's status bar and browser bars match it rather than fade from black into it. -->
    <meta name="theme-color" content="#060b12" />
    <!-- Installed on an iPhone, the page draws under the status bar; style.css keeps that strip the header's colour. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>GitHub dashboard</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- With credentials, so the login in front of the site lets it through. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
